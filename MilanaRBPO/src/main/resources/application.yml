spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://milanarbpo_postgres:5432/milanarbpo_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  open-in-view: false

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
